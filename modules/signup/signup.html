<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"  href="signup.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="buttons.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>Join TaskMaster</h1>
            <h2>Create an account to boost your productivity</h2>
        </div>

        <div class="toggle-login">
            <div class="button-bg">
                <button class="login " id="login-tab">Login</button>
                <button onclick() class="signup active" id="signup-tab" >Signup</button>
            </div>
        </div>
        <div>
            <form>
                <readonly class="readonly" for="name">Full Name*</readonly><br>
                <input type="name" id="name" name="name" placeholder="John Doe"><br> 
              <span class="material-symbols-outlined">person</span>


                <readonly class="readonly" for="email">Email Address*</readonly><br>
                <input type="text" id="email" name="email" placeholder="hello@example.com"><br> 
                <span id="icon1" class="material-symbols-outlined">mail</span>


                <readonly class="readonly" for="password">Password*</readonly><br>
                <input type="password" id="password" name="password" placeholder=".........."><br>
                <span id="icon2" class="material-symbols-outlined">lock</span>

                <div data-import="components/buttons/buttons.html"></div>

                <p> By continuing, you agree to our Terms of Service & Privacy Policy</p>

            </form>

        </div>

        <script src="assest/js/global.js"></script>
</body>
</html>
